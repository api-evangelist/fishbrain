aid: fishbrain
name: Fishbrain
description: >-
  Fishbrain is a Stockholm-based consumer technology company behind the largest
  social network and mobile app for recreational anglers, with a community of
  around 20 million fishermen and roughly 14 million logged catch locations. The
  app blends a social feed, a digital catch logbook with AI-powered species
  recognition, depth charts (from Garmin), local fishing reports with weather and
  bait intelligence, an AI-driven fishing-spot prediction map, and a searchable
  database of fishing regulations covering seasons, bag limits, and size rules.
  Fishbrain monetizes through a Fishbrain Pro subscription and is backed by
  Northzone and Seedcamp. It exposes no public developer API — api.fishbrain.com
  is a private backend for the iOS/Android apps — so this profile captures the
  company's public security, engineering, and web surface rather than an API.
